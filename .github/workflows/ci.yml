name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no Gnani/Evon keys or .env in tracked files
        run: |
          if git ls-files | grep -qxE '(.*/)?\.env'; then echo "::error::.env is tracked"; exit 1; fi
          if git grep -nIE 'vach_[A-Za-z0-9_]{20,}' -- . ; then echo "::error::Gnani API key committed"; exit 1; fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:  # ledger tests also run on Postgres (prod parity: triggers, CHECKs, SUM types)
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kk
          POSTGRES_PASSWORD: kk
          POSTGRES_DB: kk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kk -d kk" --health-interval 3s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kk:kk@localhost:5432/kk
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest (fakes only, live marker excluded; ledger on SQLite + Postgres)
        run: uv run pytest
      - name: migrations apply on sqlite
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build backend image
        run: docker build -t kirana-backend:ci backend
